<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header with environment info -->
        <header class="header">
            <div class="header-left">
                <div class="breadcrumb">
                    <span class="breadcrumb-item">Website</span>
                    <span class="breadcrumb-separator">></span>
                    <span class="breadcrumb-item current">Domain Setting</span>
                </div>
                <h1>Add Website</h1>
            </div>
                <div class="header-info">
                <div class="info-item">
                    <span class="info-label">ENVIRONMENT:</span>
                    <span id="environment">DEV</span>
                </div>
            </div>
        </header>

        <!-- Main Content with Tabs -->
        <main class="main-content">
            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-btn active" data-tab="list">Website List</button>
                <button class="tab-btn" data-tab="add">Add New Website</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- List Tab -->
                <div id="listTab" class="tab-pane active">
                    <div class="list-header">
                        <button id="refreshBtn" class="refresh-btn">Refresh</button>
                    </div>
                    
                    <div id="listResults" class="list-results">
                        <div class="no-data">
                            <p>No data available</p>
                            <p>Please go to Add tab to create data</p>
                        </div>
                    </div>
                </div>

                <!-- Add Tab -->
                <div id="addTab" class="tab-pane">
                    <form id="websiteForm" class="form">
                        <!-- Website Name -->
                        <div class="form-group">
                            <label for="websiteName">Website Name<span class="required">*</span></label>
                            <input type="text" id="websiteName" name="websiteName" placeholder="Enter website name" required 
                                   oninvalid="this.setCustomValidity('Required')" 
                                   oninput="this.setCustomValidity('')">
                        </div>

                        <!-- Endpoint -->
                        <div class="form-group">
                            <label for="endpoint">Endpoint<span class="required">*</span></label>
                            <input type="url" id="endpoint" name="endpoint" placeholder="https://example.com/api" required 
                                   oninvalid="
                                       if (this.value === '') {
                                           this.setCustomValidity('Required');
                                       } else {
                                           this.setCustomValidity('Invalid URL format');
                                       }
                                   " 
                                   oninput="this.setCustomValidity('')">
                        </div>

                        <!-- Wallet Mode -->
                        <div class="form-group">
                            <fieldset>
                                <legend>Wallet Mode<span class="required">*</span></legend>
                                <div class="radio-group">
                                    <label class="radio-item" for="walletModeSingle">
                                        <input type="radio" id="walletModeSingle" name="walletMode" value="single" required oninvalid="this.setCustomValidity('Required')" onchange="this.setCustomValidity('')">
                                        <span class="radio-label">Single Wallet</span>
                                    </label>
                                    <label class="radio-item" for="walletModeMultiple">
                                        <input type="radio" id="walletModeMultiple" name="walletMode" value="multiple" required>
                                        <span class="radio-label">Multiple Wallets</span>
                                    </label>
                                </div>
                            </fieldset>
                        </div>

                        <!-- Update Button -->
                        <div class="form-actions">
                            <button type="submit" id="updateBtn" class="update-btn" disabled>UPDATE</button>
                        </div>
                    </form>

                    <!-- Status Message -->
                    <div id="statusMessage" class="status-message"></div>
                </div>
            </div>
            
            <!-- Global Status Message -->
            <div id="globalStatusMessage" class="status-message"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
